server_port: 3000
db_path: "data.db"
persist_interval_secs: 5

devices:
  - id: "plts_1"
    ip: "192.168.1.10"
    port: 502
    unit_id: 1
    interval_ms: 1000
    endianness: "big"
    registers:
      - name: "voltage"
        address: 40001
        type: "float32"
        scale: 0.1
      - name: "current"
        address: 40003
        type: "float32"
        scale: 0.01
      - name: "power"
        address: 40005
        type: "float32"
      - name: "frequency"
        address: 40007
        type: "float32"
      - name: "power_factor"
        address: 40009
        type: "float32"
      - name: "energy_total"
        address: 40011
        type: "float32"

  - id: "plts_2"
