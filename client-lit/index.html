<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voltrus Lite (Lit)</title>
  <base href="/lit/">
  <link rel="icon" type="image/png" href="favicon-32.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
  <style>
    :root {
      --bg: #09090b;
      --card: #111113;
      --border: #27272a;
      --border-light: #3f3f46;
      --text: #e4e4e7;
      --text-dim: #a1a1aa;
      --text-muted: #71717a;
      --warn: #f59e0b;
      --crit: #ef4444;
      --ok: #22c55e;
      --cyan: #22c55e;
      --fg: var(--text);
      --green: #22c55e;
      --muted: var(--text-muted);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; }
    #app { height: 100%; }
    button { cursor: pointer; border: none; background: none; color: var(--text); font-family: inherit; }
    input, select { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 10px; font-family: 'JetBrains Mono', monospace; font-size: 13px; outline: none; }
    input:focus, select:focus { border-color: var(--border-light); }
  </style>
</head>
<body>
  <div id="app">
    <vlt-app-shell></vlt-app-shell>
  </div>

  <script type="module" src="dist/bundle.js"></script>
</body>
</html>
