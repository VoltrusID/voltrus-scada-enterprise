[graph]
targets = [
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
yanked = "warn"
ignore = [
    # rsa: Marvin Attack — no fix available, transitive dep
    "RUSTSEC-2023-0071",
    # atomic-polyfill: unmaintained — transitive via opcua
    "RUSTSEC-2023-0089",
    # rustls-pemfile is unmaintained — upstream dependency of reqwest/rustls
    "RUSTSEC-2025-0134",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "OpenSSL",
    "CC0-1.0",
    "0BSD",
    "NOASSERTION",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = []
