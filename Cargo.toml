[package]
name = "voltrus"
version = "0.35.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "voltrus"
path = "src/main.rs"

[[bin]]
name = "modbus-sim"
path = "src/bin/modbus-sim.rs"

[[bin]]
name = "s7-sim"
path = "src/bin/s7-sim.rs"

[[bin]]
name = "opcua-sim"
path = "src/bin/opcua-sim.rs"

[[bin]]
name = "mqtt-sim"
path = "src/bin/mqtt-sim.rs"

[[bin]]
name = "dnp3-sim"
path = "src/bin/dnp3-sim.rs"

[[bin]]
name = "bacnet-sim"
path = "src/bin/bacnet-sim.rs"

[features]
default = ["snmp_scan"]
openapi = []
snmp_scan = []

[dependencies]
tokio = { version = "=1.52.1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
tokio-stream = { version = "=0.1.18", features = ["sync"] }
tokio-modbus = { version = "=0.16.1", default-features = false, features = ["tcp", "tcp-server"] }
axum = { version = "=0.8.9", features = ["ws", "multipart"] }
csv = "1"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
utoipa-axum = "0.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
serde_yaml_neo = "0.11"
rusqlite = { version = "=0.34.0", features = ["bundled", "backup"] }
anyhow = "=1.0.102"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tower-http = { version = "=0.6.8", features = ["cors", "fs"] }
axum-extra = { version = "=0.10.3", features = ["cookie"] }
hmac = "=0.12.1"
sha2 = "=0.10.9"
hex = "=0.4.3"
base64 = "=0.22.1"
argon2 = "=0.5.3"
password-hash = "=0.5.0"
rand = "=0.9.4"
dashmap = "=6.1.0"
flate2 = "=1.1.9"
tar = "=0.4"
sysinfo = "=0.34.2"
time = { version = "=0.3.47", features = ["local-offset"] }
jsonwebtoken = "=9.3"
reqwest = { version = "=0.12.15", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
lettre = { version = "=0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
ed25519-dalek = "=2.1.1"
web-push = { version = "=0.11.0", default-features = false, features = ["hyper-client"] }
openssl = { version = "0.10", features = ["vendored"] }
tempfile = "=3.27.0"
async-opcua = { version = "=0.18.0", default-features = false, features = ["client", "server"] }
rmp-serde = "=1.3.0"
bacnet-rs = "0.3"
futures-util = "=0.3.31"
rumqttd = "0.20"

rquickjs = "0.10"
regex = "1"
wasmtime = "43"
zip = "=2.4"
calamine = "0.34.0"
snmp = "0.2.2"

[dev-dependencies]
http = "=1.4.0"
tower = { version = "=0.5.3", features = ["util"] }
