title = "voltrus-scada-enterprise"

[extend]
useDefault = true

# Known false positives: placeholder licence keys in tests and design docs,
# sensor key names in dev mock data, local dev server ports.
[[allowlists]]
description = "Placeholder keys and mock data"
paths = [
  '''client/src/App\.tsx''',
  '''client/tests/edition\.test\.ts''',
  '''docs/superpowers/specs/2025-05-01-license-activation-design\.md''',
  '''native/src/api\.rs''',
]

# Test-only secrets: a hex counting pattern used as the hot standby link secret,
# and the fixed auth secret an early version of scripts/sso-live used locally.
[[allowlists]]
description = "Test secrets"
regexTarget = "match"
regexes = [
  '''0123456789abcdef0123456789abcdef0123456789abcdef''',
  '''sso-live-secret-sso-live-secret-0123456789''',
]
