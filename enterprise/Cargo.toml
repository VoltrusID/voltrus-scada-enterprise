# Voltrus Enterprise add-on (source available, commercial licence). Official builds = open core + this crate.
# Production use needs a paid licence key; see LICENSE.

[package]
name = "voltrus-enterprise"
version = "0.47.1"
edition = "2024"
license-file = "LICENSE"
publish = false
default-run = "voltrus"
description = "Voltrus Enterprise add-on: licensing, SSO, 21 CFR Part 11, IEC 62443 audit, hot standby, multi-site hub, RTSP video, white-label, scheduled reports"

# Own workspace so the public core can be built without this directory.
[workspace]

[lib]
name = "voltrus_enterprise"
path = "src/lib.rs"

[[bin]]
name = "voltrus"
path = "src/main.rs"

# Test node for the hot standby integration test: the real add-on with a stub
# Enterprise licence, so a pair can run without a signed key. Not built by default
# and not part of any release.
[[bin]]
name = "voltrus-ha-test-node"
path = "src/bin/ha_test_node.rs"
required-features = ["ha-test-node"]

[[test]]
name = "ha_pair"
path = "tests/ha_pair.rs"
required-features = ["ha-test-node"]

[features]
ha-test-node = []

[dependencies]
# The open core: the public repository, checked out as the `core` git submodule.
voltrus = { path = "../core" }
tokio = { version = "=1.52.1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
axum = { version = "=0.8.9", features = ["ws", "multipart"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
anyhow = "=1.0.104"
tracing = "=0.1.44"
base64 = "=0.22.1"
hmac = "=0.12.1"
sha2 = "=0.10.9"
hex = "=0.4.3"
rand = "=0.9.4"
time = { version = "=0.3.47", features = ["local-offset", "parsing", "formatting"] }
sysinfo = "=0.34.2"
ed25519-dalek = "=2.1.1"
jsonwebtoken = "=9.3"
reqwest = { version = "=0.12.15", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
lettre = { version = "=0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
futures-util = "=0.3.31"
dashmap = "=6.1.0"
rmp-serde = "=1.3.0"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
# SSO: SAML XML signatures (pure Rust, no xmlsec/libxml2) and LDAP over rustls.
roxmltree = "=0.20.0"
rsa = { version = "=0.9.10", features = ["sha2"] }
sha1 = { version = "=0.10.7", features = ["oid"] }
x509-cert = { version = "=0.2.5", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ldap3 = { version = "=0.12.1", default-features = false, features = ["tls-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
axum-extra = { version = "=0.10.3", features = ["cookie"] }
url = "2"
serde_yaml_neo = "0.11"
# Hot standby: the node link (TLS 1.3 with the ring provider, like reqwest above) and
# the change feed over the same SQLite the core links.
rusqlite = { version = "=0.34.0", features = ["bundled"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[dev-dependencies]
tempfile = "=3.27.0"
bytes = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# Generating a 2048-bit RSA test key takes seconds unoptimised.
[profile.dev.package.num-bigint-dig]
opt-level = 3
