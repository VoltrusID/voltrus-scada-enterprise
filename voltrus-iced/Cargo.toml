[package]
name = "voltrus-iced"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
iced = { version = "=0.13.1", features = ["tokio"] }
iced_aw = { version = "=0.13.0", default-features = false, features = ["card"] }
plotters-iced = "=0.11.0"
plotters = { version = "=0.3.7", default-features = false, features = ["line_series", "point_series"] }
reqwest = { version = "=0.12.15", default-features = false, features = ["json", "rustls-tls", "cookies"] }
tokio = { version = "=1.52.1", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
anyhow = "=1.0.102"
chrono = { version = "=0.4.40", default-features = false, features = ["clock"] }
