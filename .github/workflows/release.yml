name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  R2_BUCKET: voltrus-lite-releases

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      should_release: ${{ steps.ver.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: ver
        run: |
          VERSION="v$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git fetch origin "refs/tags/$VERSION" 2>/dev/null && [ "$(git rev-parse "refs/tags/$VERSION" 2>/dev/null)" = "$(git rev-parse HEAD)" ]; then
            echo "Tag $VERSION already exists at HEAD — skipping"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $VERSION — will release"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Linux x86_64 ───────────────────────────────────────────
  build-linux-x86_64:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            client-lit/package-lock.json

      - name: Build frontend (React)
        run: |
          cd client
          npm ci
          npm run build
          mkdir -p ../static
          cp -r dist/* ../static/

      - name: Build frontend (Lit)
        run: |
          cd client-lit
          npm ci
          npm run build
          mkdir -p ../client-lit-dist/dist
          cp index.html ../client-lit-dist/
          cp dist/bundle.js ../client-lit-dist/dist/
          cp -r public/* ../client-lit-dist/ 2>/dev/null || true

      - name: Install musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: musl-x86_64

      - name: Build release binaries
        run: |
          cargo build --release --target x86_64-unknown-linux-musl --bin voltrus-lite-rust-service
          cargo build --release --target x86_64-unknown-linux-musl --bin modbus-sim

      - name: Strip binaries
        run: |
          strip target/x86_64-unknown-linux-musl/release/voltrus-lite-rust-service
          strip target/x86_64-unknown-linux-musl/release/modbus-sim

      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/voltrus-lite-rust-service dist/
          cp target/x86_64-unknown-linux-musl/release/modbus-sim dist/
          cp config.yaml dist/config.yaml.example
          cp deploy/voltrus-lite.service dist/
          cp -r static dist/static
          mv client-lit-dist dist/client-lit
          tar -czf voltrus-lite-${{ needs.check-version.outputs.version }}-linux-x86_64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: voltrus-lite-${{ needs.check-version.outputs.version }}-linux-x86_64.tar.gz

  # ── Windows x86_64 ─────────────────────────────────────────
  build-windows:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            client-lit/package-lock.json

      - name: Build frontend (React)
        run: |
          cd client
          npm ci
          npm run build
          mkdir -p ../static
          cp -r dist/* ../static/

      - name: Build frontend (Lit)
        run: |
          cd client-lit
          npm ci
          npm run build
          mkdir -p ../client-lit-dist/dist
          cp index.html ../client-lit-dist/
          cp dist/bundle.js ../client-lit-dist/dist/
          cp -r public/* ../client-lit-dist/ 2>$null || $true

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Build release binary
        run: cargo build --release --bin voltrus-lite-rust-service

      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item "target\release\voltrus-lite-rust-service.exe" "dist\voltrus-lite.exe"
          Copy-Item "config.yaml" "dist\config.yaml.example"
          Copy-Item -Recurse "static" "dist\static"
          Copy-Item -Recurse "client-lit-dist" "dist\client-lit"
          Compress-Archive -Path "dist\*" -DestinationPath "voltrus-lite-${{ needs.check-version.outputs.version }}-windows-x86_64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: voltrus-lite-${{ needs.check-version.outputs.version }}-windows-x86_64.zip

  # ── Security Scan ──────────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'

  # ── Release + R2 Upload ────────────────────────────────────
  release:
    needs: [check-version, build-linux-x86_64, build-windows, security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64

      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          files: |
            voltrus-lite-${{ env.VERSION }}-linux-x86_64.tar.gz
            voltrus-lite-${{ env.VERSION }}-windows-x86_64.zip
          generate_release_notes: true

      - name: Upload to R2 via Cloudflare API
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BUCKET: voltrus-lite-releases
        run: |
          upload_file() {
            local file="$1"
            local key="$2"
            echo "Uploading $file to R2 as $key..."
            curl -s -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/${BUCKET}/objects/${key}" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file"
            echo ""
          }

          upload_file "voltrus-lite-${{ env.VERSION }}-linux-x86_64.tar.gz" "voltrus-lite-${{ env.VERSION }}-linux-x86_64.tar.gz"
          upload_file "voltrus-lite-${{ env.VERSION }}-windows-x86_64.zip" "voltrus-lite-${{ env.VERSION }}-windows-x86_64.zip"

          echo "All files uploaded to R2 successfully."
