name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      should_release: ${{ steps.ver.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: ver
        run: |
          VERSION="v$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git fetch origin "refs/tags/$VERSION" 2>/dev/null && [ "$(git rev-parse "refs/tags/$VERSION" 2>/dev/null)" = "$(git rev-parse HEAD)" ]; then
            echo "Tag $VERSION already exists at HEAD — skipping"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $VERSION — will release"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            client-lit/package-lock.json

      - name: Build frontend (React)
        run: |
          cd client
          npm ci
          npm run build
          mkdir -p ../static
          cp -r dist/* ../static/

      - name: Build frontend (Lit)
        run: |
          cd client-lit
          npm ci
          npm run build
          mkdir -p ../client-lit-dist/dist
          cp index.html ../client-lit-dist/
          cp dist/bundle.js ../client-lit-dist/dist/
          cp -r public/* ../client-lit-dist/ 2>/dev/null || true

      - name: Install musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binaries
        run: |
          cargo build --release --target x86_64-unknown-linux-musl --bin voltrus-lite-rust-service
          cargo build --release --target x86_64-unknown-linux-musl --bin modbus-sim

      - name: Strip binaries
        run: |
          strip target/x86_64-unknown-linux-musl/release/voltrus-lite-rust-service
          strip target/x86_64-unknown-linux-musl/release/modbus-sim

      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/voltrus-lite-rust-service dist/
          cp target/x86_64-unknown-linux-musl/release/modbus-sim dist/
          cp config.yaml dist/config.yaml.example
          cp deploy/voltrus-lite.service dist/
          cp -r static dist/static
          mv client-lit-dist dist/client-lit
          tar -czf voltrus-lite-rust-service-linux-x86_64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: voltrus-lite-rust-service-linux-x86_64.tar.gz

  release:
    needs: [check-version, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64

      - name: Create tag and release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          files: voltrus-lite-rust-service-linux-x86_64.tar.gz
          generate_release_notes: true
