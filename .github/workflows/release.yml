name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build frontend
        run: |
          cd client
          npm ci
          npm run build
          mkdir -p ../static
          cp -r dist/* ../static/

      - name: Install musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binaries
        run: |
          cargo build --release --target x86_64-unknown-linux-musl --bin voltrus-lite-rust-service
          cargo build --release --target x86_64-unknown-linux-musl --bin modbus-sim

      - name: Strip binaries
        run: |
          strip target/x86_64-unknown-linux-musl/release/voltrus-lite-rust-service
          strip target/x86_64-unknown-linux-musl/release/modbus-sim

      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/voltrus-lite-rust-service dist/
          cp target/x86_64-unknown-linux-musl/release/modbus-sim dist/
          cp config.yaml dist/config.yaml.example
          cp deploy/voltrus-lite.service dist/
          cp -r static dist/static
          tar -czf voltrus-lite-rust-service-linux-x86_64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: voltrus-lite-rust-service-linux-x86_64.tar.gz

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: voltrus-lite-rust-service-linux-x86_64.tar.gz
          generate_release_notes: true
