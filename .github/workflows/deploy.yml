name: Deploy to VPS

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (e.g. v0.9.0 or 'latest')"
        required: false
        default: latest

jobs:
  deploy:
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Setup SSH via cloudflared tunnel
        env:
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          cat >> ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/key
            StrictHostKeyChecking no
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h --id "$CF_ID" --secret "$CF_SECRET"
          EOF

      - name: Deploy
        env:
          VERSION: ${{ github.event.inputs.version || 'latest' }}
        run: |
          ssh vps "VERSION=$VERSION bash -s" <<'SCRIPT'
          set -euo pipefail
          INSTALL_DIR="/opt/voltrus"
          REPO="dzulfikar08/voltrus"
          SERVICES=(voltrus modbus-sim modbus-sim-1)
          HEALTH_URL="http://localhost:3000/api/health"
          VERSION="${VERSION:-latest}"

          # Resolve "latest" to actual tag name
          if [ "$VERSION" = "latest" ]; then
            VERSION="$(gh release list --repo "${REPO}" --limit 1 --json tagName --jq '.[0].tagName')"
            echo "Resolved latest to ${VERSION}"
          fi

          echo "==> Downloading release ${VERSION}..."
          ARCHIVE="voltrus-${VERSION}-linux-x86_64.tar.gz"
          gh release download "${VERSION}" --repo "${REPO}" --pattern "${ARCHIVE}" --clobber

          echo "==> Stopping services..."
          for svc in "${SERVICES[@]}"; do sudo systemctl stop "$svc" || true; done
          sleep 1

          echo "==> Extracting to ${INSTALL_DIR}..."
          sudo tar -xzf "${ARCHIVE}" -C "${INSTALL_DIR}/" --overwrite
          sudo chmod +x "${INSTALL_DIR}/voltrus" "${INSTALL_DIR}/modbus-sim"

          echo "==> Starting services..."
          for svc in "${SERVICES[@]}"; do sudo systemctl start "$svc"; done

          echo "==> Running health check..."
          ELAPSED=0
          until curl -sf "${HEALTH_URL}" > /dev/null 2>&1; do
            sleep 1
            ELAPSED=$((ELAPSED + 1))
            if [ "$ELAPSED" -ge 30 ]; then
              echo "ERROR: Health check failed after 30s"
              sudo systemctl status voltrus --no-pager
              exit 1
            fi
          done
          echo "==> Deploy complete!"
          rm -f "${ARCHIVE}"
          SCRIPT
