name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Rust Backend ──────────────────────────────────────────
  rust-check:
    name: Rust Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voltrus
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            voltrus/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('voltrus/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -W clippy::all
        # TODO: Gradually fix 190 clippy warnings then switch to -D warnings
        # Track: collapsible_if (75), too_many_arguments (18), derive (6), etc.

      - name: Run tests
        run: cargo test --verbose

      - name: Check build (release)
        run: cargo check --release

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: voltrus-linux-amd64
          path: voltrus/target/release/voltrus-lite-rust-service

  # ── React Frontend ────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voltrus/client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: voltrus/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build

      - name: Check bundle size
        run: |
          echo "### Frontend Bundle Sizes" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -h dist/assets/* | sort -rh >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ── Cloudflare Worker ─────────────────────────────────────
  worker-check:
    name: Worker Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voltrus-cloudflare-worker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: voltrus-cloudflare-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit || echo "No tsconfig found, skipping"

  # ── Landing Page ──────────────────────────────────────────
  landing-check:
    name: Landing Page Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check HTML files exist
        run: |
          for f in index.html docs.html changelog.html activate.html; do
            test -f "voltrus-landing/$f" && echo "✓ $f" || (echo "✗ Missing $f" && exit 1)
          done

      - name: Validate schema.org version matches Cargo.toml
        run: |
          CARGO_VER=$(grep '^version' voltrus/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          LANDING_VER=$(grep 'softwareVersion' voltrus-landing/index.html | head -1 | sed 's/.*: "\(.*\)".*/\1/')
          if [ "$CARGO_VER" != "$LANDING_VER" ]; then
            echo "::error::Version mismatch: Cargo.toml=$CARGO_VER, index.html=$LANDING_VER"
            exit 1
          fi
          echo "✓ Version consistent: $CARGO_VER"
